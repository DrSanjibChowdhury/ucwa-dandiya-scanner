<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCWA Dandiya Event 2026 - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
      background: #fff8ed;
      color: #33220f;
      text-align: center;
    }

    h1 { color: #8b1e3f; font-size: 26px; }

    #reader {
      width: 100%;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 0;
      border-radius: 8px;
      background: #8b1e3f;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled { opacity: .5; }

    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background: #f0e7d8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>💃 UCWA Dandiya Event 2026</h1>
  <p>Volunteer QR Check-in Scanner</p>

  <div id="reader"></div>

  <button id="startButton" type="button" onclick="startScanner()">
    Start Camera
  </button>

  <button id="stopButton" type="button" onclick="stopScanner()" disabled>
    Stop Camera
  </button>

  <div id="status" role="status" aria-live="polite">
    Ready. Tap Start Camera.
  </div>

  <script>
    const SCRIPT_BASE =
      "https://script.google.com/macros/s/AKfycbyBydZOKJQLp7I9ogJs3hCJs6WnV1NErMvq2Y1mqwpipYTbAXwqK8cT-ru7lq6wwYS5/exec";

    let scanner = null;
    let starting = false;
    let processing = false;

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    async function startScanner() {
      if (starting || (scanner && scanner.isScanning)) return;

      starting = true;
      document.getElementById("startButton").disabled = true;
      setStatus("Loading scanner and requesting camera access...");

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error(
            "Scanner library did not load. Check internet access and refresh."
          );
        }

        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 240, height: 240 }
          },
          function(decodedText) {
            handleScannedQR(decodedText);
          },
          function() {
            // No QR detected in this frame; continue scanning.
          }
        );

        document.getElementById("stopButton").disabled = false;
        setStatus("Camera active. Point it at an attendee ticket QR code.");

      } catch (error) {
        setStatus(
          "CAMERA START FAILED\n\n" +
          (error && error.message ? error.message : String(error)) +
          "\n\nCheck camera permission and internet access, then retry."
        );
        document.getElementById("startButton").disabled = false;

      } finally {
        starting = false;
      }
    }

    async function stopScanner() {
      if (!scanner || !scanner.isScanning) return;

      try {
        await scanner.stop();
        document.getElementById("stopButton").disabled = true;
      } catch (error) {
        setStatus("Could not stop camera: " + error.message);
      }
    }

    async function handleScannedQR(decodedText) {
      if (processing) return;
      processing = true;

      setStatus("QR detected. Reading ticket...");

      try {
        const text = decodedText.trim();
        let ticketId = "";

        // QR may contain the full Apps Script ticket URL.
        try {
          const url = new URL(text);
          const expected = new URL(SCRIPT_BASE);

          if (
            url.origin === expected.origin &&
            url.pathname.replace(/\/+$/, "") ===
              expected.pathname.replace(/\/+$/, "")
          ) {
            ticketId = url.searchParams.get("ticket") || "";
          }
        } catch (error) {
          // It may instead contain a standalone ticket ID.
        }

        // Support a QR containing only the 16-character ticket ID.
        if (!ticketId && /^[A-Fa-f0-9]{16}$/.test(text)) {
          ticketId = text;
        }

        // Support text that includes a ticket query parameter.
        if (!ticketId) {
          const match = text.match(/[?&]ticket=([A-Fa-f0-9]{16})/i);
          if (match) ticketId = match[1];
        }

        if (!/^[A-Fa-f0-9]{16}$/.test(ticketId)) {
          processing = false;
          setStatus(
            "QR FORMAT NOT RECOGNISED\n\n" +
            "This QR does not contain a valid UCWA ticket ID. " +
            "Scan the QR generated by the event registration page."
          );
          return;
        }

        await stopScanner();

        setStatus("Ticket detected. Opening authorised check-in page...");

        const approvalUrl =
          SCRIPT_BASE +
          "?page=checkin&ticket=" +
          encodeURIComponent(ticketId.toUpperCase());

        window.location.assign(approvalUrl);

      } catch (error) {
        processing = false;
        setStatus("SCAN ERROR\n\n" + (error.message || String(error)));
      }
    }
  </script>
</body>
</html>
